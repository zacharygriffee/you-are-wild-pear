<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider Credential — You Are Wild</title>
  <link rel="stylesheet" href="./credential-entry.css">
</head>
<body>
  <main>
    <p class="eyebrow">Trusted desktop window</p>
    <h1>Provider credential</h1>
    <p class="boundary">This window does not load You Are Wild or its modules. Your key goes directly to Electron main and is never returned to the game renderer.</p>

    <dl class="profile" aria-label="Provider profile">
      <div><dt>Connection</dt><dd id="profile-name">Loading…</dd></div>
      <div><dt>Endpoint</dt><dd id="profile-endpoint">Loading…</dd></div>
      <div><dt>Model</dt><dd id="profile-model">Loading…</dd></div>
    </dl>

    <form id="credential-form">
      <label for="credential">API key or bearer token</label>
      <input
        id="credential"
        name="credential"
        type="password"
        maxlength="500"
        autocomplete="new-password"
        spellcheck="false"
        required
        autofocus
      >
      <label class="remember">
        <input id="persist" type="checkbox">
        <span><strong>Remember securely</strong><small id="storage-detail">Checking operating-system storage…</small></span>
      </label>
      <p id="message" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="cancel" type="button">Cancel</button>
        <button id="submit" class="primary" type="submit">Save credential</button>
      </div>
    </form>
  </main>
  <script src="./credential-entry.js"></script>
</body>
</html>
